<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoFast — Plataforma de Entregas</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MotoFast" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "df32f4f0-4280-4127-9d84-ec8a0a05328c",
          safari_web_id: "web.onesignal.auto.18f55e14-9585-4855-a0ee-ea6515e10e22",
          notifyButton: { enable: false },
          allowLocalhostAsSecureOrigin: false,
          serviceWorkerPath: "sw.js",
          serviceWorkerParam: { scope: "/" },
        });
      });
    </script>
    <!-- ═══ VERIFICADOR AUTOMÁTICO DE ATUALIZAÇÃO — adicionado em 28/08/2026 ═══
         Problema: o app é um PWA instalado na tela do celular, e por isso não
         busca versão nova sozinho ao abrir — fica preso na versão de quando foi
         instalado, mesmo depois de a gente subir código novo no ar. Isso fez
         vários motoboys ficarem rodando código de dias atrás sem saber, e
         perderem pedidos do sistema de rodízio novo sem perceber nada de errado
         na tela deles.
         Solução: esse script (puro, sem depender do React) roda escondido,
         verificando a cada 60 segundos (e toda vez que o app volta a ficar em
         primeiro plano) se o arquivo dessa mesma página mudou no servidor. Se
         mudou, recarrega a página sozinho, sem avisar nada — o motoboy/
         empresário nunca precisa fechar app, sair de conta, nem limpar cache
         manualmente nunca mais. Funciona porque o Vite troca o nome do arquivo
         principal (main-XXXXX.js) toda vez que a gente sobe código novo — então
         comparar esse nome é a forma mais confiável de saber se saiu versão nova. -->
    <script>
      (function () {
        function pegarBundleAtual() {
          var s = document.querySelector('script[type="module"]');
          return s ? s.getAttribute('src') : null;
        }
        var bundleAtual = pegarBundleAtual();

        async function checarVersaoNova() {
          try {
            var resp = await fetch('/', { cache: 'no-store' });
            var html = await resp.text();
            var m = html.match(/<script[^>]+type=["']module["'][^>]+src=["']([^"']+)["']/i);
            var bundleNovo = m ? m[1] : null;
            if (bundleNovo && bundleAtual && bundleNovo !== bundleAtual) {
              console.log('[MotoFast] Nova versão detectada — recarregando automaticamente...');
              window.location.reload();
            }
          } catch (e) {
            // Sem internet no momento — tenta de novo na próxima checagem, sem travar nada
          }
        }

        // Checa a cada 60 segundos, e também sempre que o app volta a ficar visível
        // (ex: motoboy que estava com a tela apagada e reabre o celular)
        setInterval(checarVersaoNova, 60000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checarVersaoNova();
        });
      })();
    </script>
    <style>
      body { background: #0a0f1a; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
